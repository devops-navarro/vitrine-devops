name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# um push novo no mesmo PR cancela a execução anterior, que já ficou velha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  testes:
    name: testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        servico: [clientes, catalogo, pedidos]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitrine
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: vitrine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitrine"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Senhas de um banco descartável que só existe durante o job.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vitrine
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: ci-admin
      CLIENTES_DB_PASSWORD: ci-clientes
      CATALOGO_DB_PASSWORD: ci-catalogo
      PEDIDOS_DB_PASSWORD: ci-pedidos
      API_KEYS: chave-do-ci-com-mais-de-trinta-e-dois-caracteres
      CLIENTES_URL: http://localhost:8001
      CLIENTES_API_KEY: chave-do-ci-com-mais-de-trinta-e-dois-caracteres
      CATALOGO_URL: http://localhost:8002
      CATALOGO_API_KEY: chave-do-ci-com-mais-de-trinta-e-dois-caracteres
      # falha se o uv.lock não bater com o pyproject.toml
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.servico }}/uv.lock

      - name: Usuários e schemas no banco
        run: make db-bootstrap DB_CONTAINER=${{ job.services.postgres.id }}

      - name: Testes com cobertura mínima de 70%
        run: make ${{ matrix.servico }}-test

      - name: Migrations sobem, descem e batem com o modelo
        run: make ${{ matrix.servico }}-migrations-check

  # Sobe o ambiente inteiro como um dev faria (make up) e confere um pedido de
  # ponta a ponta. Pega Dockerfile quebrado, variável faltando no .env.example
  # e erro de rede entre os serviços.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: .env a partir do exemplo
        run: cp .env.example .env

      - name: Sobe banco e serviços
        run: make up

      - name: Smoke test
        run: make smoke

      - name: Seed
        run: make seed

      - name: Seed de novo não muda nada (idempotência)
        run: make seed ARGS=--sem-mudancas

      - name: Logs em caso de falha
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Desliga
        if: always()
        run: docker compose down --volumes

  # Automação de infraestrutura com o mesmo rigor da aplicação.
  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: ansible-core e ansible-lint nas versões do laboratório
        run: |
          uv tool install ansible-core==2.21.6
          uv tool install ansible-lint==26.11.0

      - name: Coleções fixadas em requirements.yml
        run: ansible-galaxy collection install -r requirements.yml -p .gerado/colecoes

      - name: Sintaxe do playbook
        # sem a VM, um inventário vazio basta para validar a estrutura
        run: ansible-playbook site.yml --syntax-check -i localhost,

      - name: ansible-lint (perfil production)
        run: ansible-lint

  # Os scripts precisam rodar no Linux, não só no macOS onde foram escritos.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: shellcheck
        run: shellcheck --version | head -2 && make scripts-lint

      - name: Testes bats
        run: make scripts-test
