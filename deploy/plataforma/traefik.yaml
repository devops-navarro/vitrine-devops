# Ingress controller do cluster local. No EKS, o mesmo recurso Ingress vira um
# ALB pelo AWS Load Balancer Controller (ADR 0002); só muda o ingressClassName.

deployment:
  replicas: 1

# Com hostPort, só um pod por nó ocupa a porta 80. O padrão (sobe o novo antes
# de tirar o antigo) trava: o novo espera uma porta que o antigo nunca libera.
# Aqui o antigo sai primeiro; a atualização do Traefik local tem segundos sem
# ingress. No EKS não há hostPort: quem recebe o tráfego é o ALB.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# no nó que recebe as portas 80 do Mac (deploy/kind/cluster.yaml)
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ports:
  web:
    # hostPort: a porta 80 do nó, que o kind liga à 8080 do Mac
    hostPort: 80
  websecure:
    expose:
      default: false

service:
  spec:
    # a entrada é pela hostPort do nó; nada de LoadBalancer no cluster local
    type: ClusterIP

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    # O status do Ingress precisa de um endereço, senão o Argo CD o considera
    # "Progressing" para sempre. O Service é ClusterIP (não tem endereço
    # externo), então publicamos o endereço real de acesso. No EKS, quem
    # preenche este campo é o AWS Load Balancer Controller, com o ALB.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
  kubernetesCRD:
    enabled: false

# painel e API do Traefik desligados: nada além das rotas declaradas
ingressRoute:
  dashboard:
    enabled: false

log:
  format: json
accessLog:
  enabled: true
  format: json

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
