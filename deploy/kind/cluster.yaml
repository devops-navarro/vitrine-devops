# Cluster local: make k8s-up / make k8s-down.
# Mesma versão do Kubernetes do EKS (infra/modules/eks), imagem fixada por digest.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vitrine

nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      # o ingress controller roda só aqui, onde as portas do Mac chegam
      ingress-ready: "true"
    extraPortMappings:
      # só o próprio Mac alcança o cluster
      - containerPort: 80
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
  # Dois workers: réplicas espalhadas por nós diferentes e PodDisruptionBudget
  # com efeito real ao drenar um nó.
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
