# Um usuário por serviço, dono só do próprio schema (ADR 0001). Roda o mesmo
# infra/postgres/bootstrap.sql do Mac e do docker compose, montado de um ConfigMap.
# Idempotente: o make apaga o Job anterior e cria de novo.
apiVersion: batch/v1
kind: Job
metadata:
  name: banco-bootstrap
  namespace: vitrine
  labels:
    app.kubernetes.io/name: banco-bootstrap
    app.kubernetes.io/part-of: vitrine
  annotations:
    # No Argo CD: roda depois que o PostgreSQL fica saudável e é recriado a cada
    # sincronização (Job é imutável). O kubectl apply ignora estas anotações.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    checkov.io/skip1: CKV_K8S_11=sem limite de CPU de propósito, para evitar throttling; o limite de memória continua
    checkov.io/skip2: CKV_K8S_43=imagem oficial com versão exata na tag; fixar por digest é melhoria anotada
    checkov.io/skip4: CKV_K8S_15=tag com versão exata (17.11-alpine3.24), então IfNotPresent basta
    checkov.io/skip5: CKV_K8S_40=uid 70 é o usuário postgres da imagem oficial; banco só do cluster local, na AWS é o RDS
    checkov.io/skip3: CKV_K8S_35=o psql lê as senhas do ambiente com \getenv, sem passar pela linha de comando
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banco-bootstrap
        app.kubernetes.io/part-of: vitrine
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:17.11-alpine3.24
          imagePullPolicy: IfNotPresent
          command: ["psql", "-q", "-h", "postgres", "-d", "postgres", "-f", "/bootstrap/bootstrap.sql"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: vitrine-banco, key: admin-usuario}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: vitrine-banco, key: admin-senha}
            - name: POSTGRES_DB
              value: vitrine
            - name: CLIENTES_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: vitrine-banco, key: clientes-senha}
            - name: CATALOGO_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: vitrine-banco, key: catalogo-senha}
            - name: PEDIDOS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: vitrine-banco, key: pedidos-senha}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: sql
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: banco-bootstrap-sql
---
# O bootstrap só conversa com o DNS e com o banco, e ninguém conversa com ele.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banco-bootstrap
  namespace: vitrine
  labels:
    app.kubernetes.io/name: banco-bootstrap
    app.kubernetes.io/part-of: vitrine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banco-bootstrap
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
