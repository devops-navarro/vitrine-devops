---
- name: Instala nginx e ufw
  ansible.builtin.apt:
    name:
      - nginx
      - ufw
    state: present

- name: Cria a pasta do site
  ansible.builtin.file:
    path: /var/www/vitrine
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publica a página
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/vitrine/index.html
    owner: root
    group: root
    mode: "0644"

- name: Configura o site
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/vitrine
    owner: root
    group: root
    mode: "0644"
  notify: Nginx mudou

- name: Ativa o site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/vitrine
    dest: /etc/nginx/sites-enabled/vitrine
    state: link
  notify: Nginx mudou

- name: Desativa o site padrão do pacote
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Nginx mudou

- name: Garante o nginx ligado agora e a cada boot
  # enable: sobe no boot; started: sobe agora. São coisas diferentes.
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Rotação dos logs do nginx
  ansible.builtin.template:
    src: logrotate-nginx.j2
    dest: /etc/logrotate.d/nginx
    owner: root
    group: root
    mode: "0644"

# Firewall: as liberações vêm antes do "nega tudo" e do ligar. Na ordem
# inversa, o próprio Ansible perderia a conexão SSH no meio da execução.
- name: Libera as portas da aplicação
  community.general.ufw:
    rule: allow
    port: "{{ item.porta }}"
    proto: tcp
    comment: "{{ item.comentario }}"
  loop: "{{ web_portas_abertas }}"
  loop_control:
    label: "{{ item.porta }}/{{ item.comentario }}"

- name: Nega toda entrada não liberada
  community.general.ufw:
    direction: incoming
    default: deny

- name: Liga o firewall
  community.general.ufw:
    state: enabled

- ansible.builtin.command: echo sem nome
