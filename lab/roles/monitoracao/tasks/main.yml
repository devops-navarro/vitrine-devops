---
- name: Instala o node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: Configura os coletores do node-exporter
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Reinicia o node-exporter

- name: Garante o node-exporter ligado agora e a cada boot
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Libera as métricas só para quem coleta
  community.general.ufw:
    rule: allow
    port: "{{ monitoracao_porta }}"
    proto: tcp
    from_ip: "{{ monitoracao_origem }}"
    comment: node-exporter
