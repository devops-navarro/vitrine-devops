[defaults]
inventory = .gerado/inventario.ini
roles_path = roles
# coleções fixadas em requirements.yml, instaladas por make lab-deps
collections_path = .gerado/colecoes
stdout_callback = default
result_format = yaml
retry_files_enabled = false
# lista o que levou mais tempo no fim da execução
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# known_hosts próprio do laboratório: aceita a chave de uma VM nova (accept-new)
# e recusa se ela mudar depois. É apagado junto com a VM.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.gerado/known_hosts
pipelining = true
