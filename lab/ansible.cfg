[defaults]
inventory = .gerado/inventario.ini
roles_path = roles
# coleções fixadas em requirements.yml, instaladas por make lab-deps
collections_path = .gerado/colecoes
stdout_callback = default
result_format = yaml
retry_files_enabled = false
# lista o que levou mais tempo no fim da execução
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# known_hosts escrito pelo inventario.sh com as chaves lidas pelo canal local
# do Lima: o SSH só aceita a chave exata, nada de confiar na primeira resposta.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.gerado/known_hosts
pipelining = true
